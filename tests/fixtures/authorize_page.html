                        showItem = '<p><b>易班服务协议</b></p><p>　</p><p><b>欢迎您使用易班的服务！</b></p><p><b>为使用易班的服务，您应当阅读并遵守《易班服务协议》（以下简称“本协议”）。请您务必审慎阅读、充分理解各条款内容，特别是免除或者限制责任的条款，以及开通或使用某项服务的单独协议。限制、免责条款可能以黑体加粗形式提示您注意。</b></p><p>除非您已阅读并接受本协议所有条款，否则您无权使用易班提供的服务。您使用易班的服务即视为您已阅读并同意上述协议的约束。</p><p>易班有权在必要时修改本协议条款。您可以在相关服务页面查阅最新版本的协议条款。</p><p>　</p><p><b>本协议条款变更后，如果您继续使用易班提供的软件或服务，即视为您已接受修改后的协议。如果您不接受修改后的协议，应当停止使用易班提供的软件或服务。</b></p><p>　</p><p><b>一、协议的范围</b></p><p>1.1本协议是您与易班之间关于用户使用易班相关服务所订立的协议。</p><p>1.2“易班”是指上海易班企业发展有限公司及其相关服务可能存在的运营关联单位。“用户”是指使用易班相关服务的使用人，在本协议中更多地称为“您”。</p><p>1.3本协议项下的服务是指易班通过“易班网”、“易班客户端”、“易班博雅网”、“易班优课”、“易班思库”、“易班数字马院”、易班在各高校开放的二级域名xxx.yiban.cn（例如复旦大学为fudan.yiban.cn、东华大学为dhu.yiban.cn）等向用户提供的包括但不限于即时通讯、网络媒体、互联网增值、互动娱乐和广告等产品及服务（以下简称“本服务”）。</p><p>1.4易班服务包括在其网站上不时说明的服务，易班保留权利随时对该等服务进行更改、更新或提高。</p><p>1.5作为易班服务的一部分，易班针对不同的传播渠道为用户直接上载、管理、传播其内容提供平台服务，该等传播渠道包括但不限于：</p><p>　　1.5.1 用户自己拥有权利的网站；</p><p>　　1.5.2 通过易班的服务；</p><p>　　1.5.3 易班提供的可以使用的其他传播渠道。</p><p>1.6本协议内容同时包括您在使用易班某一特定服务时，该服务可能会另有单独的协议、相关业务规则等（以下统称为“单独协议”）。上述内容一经正式发布，即为本协议不可分割的组成部分，您同样应当遵守。您对前述任何业务规则、单独协议的接受，即视为您对本协议全部的接受。</p><p>　</p><p><b>二、帐号与密码安全</b></p><p>2.1如果您使用易班提供的服务，您需要注册一个帐号、密码，并确保用户身份的真实性、正确性及完整性，如果资料发生变化，<b>您应及时更改。在安全完成本服务的登记程序并收到易班提供的一个帐号后，您应自行维持密码及帐号的安全。您应对任何人利用您的帐号及密码所进行的活动负完全的责任，易班无法对非法或未经您授权使用您帐号及密码的行为作出甄别，因此易班对此不承担任何责任。</b>在此，您同意并承诺做到：</p><p>　　2.1.1 当您的帐号或密码遭到未获授权的使用，或者发生其他任何安全问题时，您会立即有效通知到易班；</p><p>　　2.1.2 易班特别提醒您应妥善保管您的帐号和密码。当您使用完毕后，应安全退出。因您保管不善可能导致遭受盗号或密码失窃，责任由您自行承担。</p><p><b>2.2您承诺在注册、使用易班提供的帐号时不从事下列行为：</b></p><p>　　2.2.1 故意冒用他人信息为您注册易班帐号；</p><p>　　2.2.2 未经他人合法授权以他人名义注册易班帐号；</p><p>　　2.2.3 使用侮辱、诽谤、色情等违反公序良俗的词语注册易班帐号；</p><p>　　2.2.4 以党和国家领导人的真实姓名或音近名称注册；</p><p>　　2.2.5 以国家机构或其他机构的名称注册；</p><p>　　2.2.6 以yiban、yooc、yiban产品、yiban社区、yiban版块、yiban轻应用、“易班优课”、“易班思库”、“易班数字马院”、上海大学生在线、易班、E-class等相关或相近名称注册；</p><p>　　2.2.7 以“版主”、“VIP会员”、“管理员”等名称注册；</p><p>　　2.2.8 以各种手段批量注册或恶意注册；</p><p>　　2.2.9 其他影响用户正常使用易班服务的行为。</p><p><b>2.3您在此同意，易班有权根据自己的判定，对违反上述条款的用户拒绝提供帐号注册或取消该帐号的使用，禁止您在易班服务上的一切活动。</b></p><p>　</p><p><b>三、用户个人隐私保护</b></p><p>3.1保护用户个人隐私是易班的一项基本原则。</p><p>3.2您在注册帐号或使用本服务的过程中，可能需要填写一些必要的信息。若国家法律法规有特殊规定的，您需要填写真实的身份信息。若您填写的信息不完整，则无法使用本服务或在使用过程中受到限制。</p><p>3.3一般情况下，您可随时浏览、修改自己提交的信息，但出于安全性和身份识别的考虑，您可能无法修改注册时提供的初始注册信息及其他验证信息。</p><p>3.4易班将运用各种安全技术和程序建立完善的管理制度来保护您的个人隐私，以免遭受未经授权的访问、使用或披露。</p><p>3.5易班不会将您的个人隐私转移或披露给任何非关联的第三方，除非：</p><p>　　3.5.1相关法律法规或法院、政府机关要求；</p><p>　　3.5.2 为完成合并、分立、收购或资产转让而转移；</p><p>　　3.5.3 为提供您要求的服务所必需。</p><p>3.6更多隐私条款可查阅《易班APP隐私保护指引》，链接地址为：<b>https://www.yiban.cn/privacy.html</b>。</p><p>　</p><p><b>四、使用本服务的方式</b></p><p>4.1除非您与易班另有约定，您同意本服务仅为您个人非商业性质的使用。</p><p>4.2您应当通过易班提供或认可的方式使用本服务。您依本协议条款所取得的权利不可转让。</p><p>4.3您不得使用未经易班授权的插件、外挂或第三方工具对本协议项下的服务进行干扰、破坏、修改或施加其他影响。</p><p>　</p><p><b>五、自备设备</b></p><p>5.1您应当理解，您使用易班的服务需自行准备与相关服务有关的终端设备（如电脑、调制解调器等装置），并承担所需的费用（如电话费、上网费等费用）。</p><p>5.2您理解并同意，您使用本服务时会耗用您的终端设备和带宽等资源。</p><p>　</p><p><b>六、基于易班提供服务</b></p><p>6.1您通过本服务发送或传播的内容（包括但不限于网页、文字、图片、音频、视频、图表等）均由您自行承担责任。</p><p>6.2您发送或传播的内容应有合法来源，相关内容为您所有或您已获得权利人的授权。</p><p>6.3您同意易班可为履行本协议或提供本服务的目的而使用您发送或传播的内容。</p><p>6.4如果易班收到权利人通知，主张您发送或传播的内容侵犯其相关权利的，您同意易班有权进行独立判断并采取删除、屏蔽或断开链接等措施。</p><p>6.5为方便您使用，易班可能会提供与第三方国际互联网网站或资源进行链接。除非另有声明，易班无法对第三方网站服务进行控制，<b>您因使用或依赖上述网站或资源所生的损失或损害，易班不负担任何责任。</b></p><p>6.6您不可对易班服务的任何部分或对其使用及获得进行复制、拷贝、出售或利用易班服务进行调查、广告或将易班的服务用于其他任何商业目的，但易班对特定服务另有使用指引或规则的除外。</p><p>6.7除易班管理员拥有永久帐号外，其它用户的帐号有其生命期，一旦超过半年未上站的用户易班有权删除其帐号。</p><p>6.8易班有权随时要求用户提供真实的个人资料，否则易班有权终止该人帐号。</p><p>6.9易班有权删除、删节和修改违规内容和文章，易班有权取消违规者发表内容和文章或浏览易班的权利。</p><p>6.10易班为维护服务器，有权删除三个月以上过时的文章、图片、视频、音频、学习记录等。</p><p>6.11您在使用本服务的过程中可能需要下载软件，对于这些软件，易班给予您一项个人的、不可转让及非排他性的许可。您仅可为访问或使用本服务的目的而使用这些软件。</p><p>6.12为了改善用户体验、保证服务的安全性及产品功能的一致性，易班可能会对网站和相关软件进行更新。您应该将相关软件更新到最新版本，否则易班并不保证其能正常使用。</p><p>6.13易班可能为不同的终端设备开发不同的软件版本，您应当根据实际情况选择下载合适的版本进行安装。您可以直接从易班的网站上获取软件，也可以从得到易班授权的第三方获取。如果您从未经易班授权的第三方获取软件或与软件名称相同的安装程序，易班无法保证该软件能够正常使用，并对因此给您造成的损失不予负责。</p><p>6.14除非易班书面许可，您不得从事下列任一行为：</p><p>　　6.14.1 删除软件及其副本上关于著作权的信息；</p><p>　　6.14.2 对软件进行反向工程、反向汇编、反向编译，或者以其他方式尝试发现软件的源代码；</p><p>　　6.14.3 对易班拥有知识产权的内容进行使用、出租、出借、复制、修改、链接、转载、汇编、发表、出版、建立镜像站点等；</p><p>　　6.14.4 对                         showItem = '<p>更新日期：2026年 1月 13日</p><p>生效日期：2026年 1月 13日</p><p>　</p><p>易班APP（以下简称“易班”）是一款由上海易班企业发展有限公司（注册地为上海市杨浦区国顺路288号。以下简称“我们”）研发和运营的集教育教学、文化娱乐、生活服务于一体的在校大学生实名制移动产品。我们将通过《易班APP隐私保护指引》帮助您了解以下内容：</p><p>一.我们如何收集和使用您的信息</p><p>二.我们如何使用 Cookie 和同类技术</p><p>三.我们如何共享、转让、公开披露您的信息</p><p>四.我们如何保护您的信息</p><p>五.我们如何管理您的信息</p><p>六.我们如何处理未成年人的信息</p><p>七.本政策如何更新</p><p>八.如何联系我们</p><p><b>特别提示：我们深知个人信息对您的重要性，我们将按法律法规要求，采取相应安全保护措施，尽力保护您的个人信息安全。在使用易班服务前，请您务必仔细阅读并理解本《易班APP隐私保护指引》。特别是以粗体标识的条款，请您重点阅读。</b></p><p>　</p><p><b>如对本隐私指引有任何疑问，您可以通过本隐私指引“如何联系我们”中提供的方式与我们联系。</b></p><p>　</p><p><b>一、我们如何收集和使用您的信息</b></p><p><b>（一）、我们如何收集信息</b></p><p>在您使用易班服务的过程中，我们会遵循正当、合法、必要的原则，仅出于本隐私保护指引所述的如下目的、方式，收集您在使用服务时主动提供或因为使用服务而产生的信息，用以向您提供服务、优化我们的服务以及保障您的账号安全。</p><p>在此过程中，如涉及<b>敏感个人信息（敏感个人信息指一旦泄露、非法提供或滥用可能危害人身和财产安全，极易导致个人名誉、身心健康受到损害或歧视性待遇等的个人信息）</b>的处理，我们已经以字体加粗或其他合理方式提示您重点阅读。</p><p><b>1.为方便您注册账号、使用交互功能</b></p><p>当您注册易班账号时，我们会收集您的<b>手机号码（说明：本隐私保护指引中收集的个人信息，手机号码为必要信息，其他信息均为非必要信息）</b>。收集这些信息是为了帮助您完成易班账号的注册，保护您的账号安全，以及对高校校内学生进行身份识别和鉴权。收集此类信息是为了满足相关法律、法规关于网络实名制要求。若您不提供这类信息，您将无法正常使用我们的服务。</p><p>您还可以根据实名认证需求选择填写<b>学校、学院、姓名、学号、入学年份、录取通知书编号</b>信息，我们收集前将单独明显提醒您，填写上述信息是为了完成您在您就读学校的实名认证，以方便您使用我们服务中的交互功能。若您未完成所在学校的实名认证，您将无法使用易班APP服务中的发布、评论、点赞相应交互功能。</p><p><b>2.为了方便您展示您的个人账号资料</b></p><p>为了方便您展示您的个人账号资料，您还可以根据自身需求选择性填写<b>头像、昵称、签名、星座、生日、性别、个人主页背景</b>，不填写这些个人说明信息不影响您正常使用易班的功能。</p><p><b>3.为了方便您获取您在易班中的个人信息副本</b></p><p>为了方便您获取您在易班中的个人信息副本，您可以在个人信息导出页面填写您的<b>电子邮箱地址</b>，您的个人信息副本将会整理成文件发送到您指定的<b>电子邮箱地址</b>。</p><p><b>4.为方便您使用易班微社区、易瞄瞄、留言功能</b></p><p>当您使用易班微社区、易瞄瞄、留言功能时，您上传或发布的信息（文字、图片、视频）以及进行相关互动行为（发布跟贴、回复跟贴、点赞、发布易瞄瞄、分享）时，我们将收集<b>您上传、发布或形成的信息</b>，并使用您的<b>昵称、头像和发布内容</b>以作展示。<b>我们会视情况将收集到您上传、发布或形成的信息向第三方审核机构共享，用以审核您上传、发布或形成的信息是否符合相关法律法规的要求。</b></p><p><b>5.为方便您使用易班优课、易班思库、易班数字马院</b></p><p>当您使用易班优课、易班思库、易班数字马院时，您上传或发布的信息（文字、图片、视频）以及进行相关互动行为（发布跟贴、回复跟贴、点赞）时，我们将收集<b>您上传、发布或形成的信息</b>，并使用您的<b>学校、姓名、头像和发布内容</b>以作展示。<b>我们会视情况将收集到您上传、发布或形成的信息向第三方审核机构共享，用以审核您上传、发布或形成的信息是否符合相关法律法规的要求。</b></p><p><b>6.为方便您使用摇一摇功能</b></p><p>当您使用摇一摇功能时，我们会需要获取您的<b>传感器信息</b>，并在获得您的明示同意后，获取您的<b>位置信息</b>，帮助您搜索发现身边可连接的蓝牙设备，进行课程签到。上述信息属于敏感信息，拒绝提供这些信息仅会使您无法使用摇一摇进行课程签到，但不影响您正常使用易班的其他功能。</p><p><b>7.为方便您使用签到功能</b></p><p>当您使用签到功能进行操作，您选择提交内容时，我们将收集您选择形成的信息，并对选择内容进行分类统计。签到功能不涉及您其他个人信息的处理。</p><p><b>8.为方便您使用网薪功能</b></p><p>当您使用网薪功能时，我们将收集您的网薪使用记录，方便为您查询、展示相关历史网薪使用信息。网薪功能不涉及您其他个人信息的处理。</p><p><b>9.为方便您使用快搭功能</b></p><p>当您使用快搭功能进行报名、投票、评选等活动发布、填写问答时，我们将收集您的<b>学校、姓名、头像，以及您上传、发布或形成的信息</b>，上述信息将用于对您上传或发布的信息、内容进行合规监管、分类统计。</p><p><b>10.为方便您参与易班网专题页面活动</b></p><p>当您参与易班网专题页面活动时，我们将视专题活动具体情况，收集<b>参与活动人员手机号码、姓名、单位信息、电子邮箱、职称职务信息</b>，以及您<b>上传或发布的信息（文字、文档、图片、音频、视频）</b>，并使用上述单位信息、姓名、头像和上传、发布内容以作展示。<b>您上传的上述信息中可能包含他人的个人信息，请您务必取得他人的合法授权，并避免非法泄露他人的个人信息。我们会视情况将收集到您上传、发布或形成的信息向第三方审核机构共享，用以审核您上传、发布或形成的信息是否符合相关法律法规的要求。</b></p><p><b>11.为您提供安全保障</b></p><p>为保障向您提供安全稳定的服务，预防病毒、木马程序或识别其他恶意程序、网站，我们会依法根据网络运行安全需要在您注册、登录、自动登录时收集和处理您的<b>唯一设备标识符（Android ID、IDFV（应用开发商标识符）、IDFA（广告标示符）、OAID（匿名设备标识符））、操作系统及软件版本信息、设备状态、网络状态、应用列表（设备安装的部分应用信息）</b>，用于注册登陆保护、设备风险保护、数据防盗爬、渠道流量反作弊、刷榜刷单防护、虚假用户裂变识别及相关全栈式的账号安全风控服务。前述信息中包含您的个人敏感信息，如您不同意我们记录前述信息，可能无法完成风险控制验证。</p><p><b>12.为方便您使用易班服务中的第三方服务功能</b></p><p>易班服务中的第三方服务由外部第三方主体提供，易班无法获得您在使用该类第三方服务时产生的信息。<b>但是如果您已明示同意该第三方获得您向我们提供的个人信息（头像、昵称、校方认证信息、发布内容信息，具体的对外提供范围以交互页面中用户确认的为准），该第三方可以通过易班接口获得上述信息，除此之外，在未征得用户的明示同意前，我们不会向该第三方应用提供用户的其他个人信息。</b>另外第三方网页中使用部分功能会使用您的<b>地理位置信息</b>，该信息属于敏感信息，我们会单独请求您的授权，拒绝提供该信息将会使您无法使用上述第三方服务的特定功能，但不影响您正常使用易班的功能。</p><p>我们的产品中包含第三方SDK，如您在我们的产品中使用这类由第三方提供的服务时，您同意将由其直接收集和处理您的信息。如您想要了解目前我们产品中包含的第三方SDK服务情况，或想要查询第三方个人信息共享情况，请具体查阅《第三方共享个人信息清单》，链接地址为：<b>https://www.yiban.cn/privacy_activity.html</b>。<b>第三方收集和处理信息行为遵守其自身的隐私条款。为了最大程度保障您的信息安全，我们会对嵌入的第三方SDK的隐私协议进行查验，同时建议您在使用任何第三方SDK前先行查看其隐私条款。为保障您的合法权益，在您发现第三方SDK存在风险时，建议您立即终止相关操作并及时向我们反馈</b>，反馈方式见本政策第八章节。</p><p><b>13.系统权限获取情况说明</b></p><p><b>iOS操作系统应用权限列表</b></p><p>1) 访问位置：仅在APP使用定位功能时获取地理位置，用于摇一摇课堂签到、网页中基于地理位置打卡签到时使用。</p><p>2) Camera 相机：使用摄像头，允许App使用摄像头，主要用于帮助用户使用扫一扫、拍摄图片及视频功能。</p><p>3) Photo Library 读取和写入照片库：读取相册中的内容，允许App读取存储中的图片、视频内容，主要用于帮助用户设置头像图片，发布内容、截屏反馈功能。</p><p>4) Photo Library Additions 写入照片库：向相册中添加内容，允许App写入/下载/保存图片信息，在用户主动保存图片时使用。</p><p>5) Microphone 麦克风：使用麦克风进行录音，在用户使用在线客服进行语音反馈问题时使用。</p><p>6) Bluetooth Always Use 持续使用蓝牙设备：持续使用蓝牙，用于发现和连接附近的蓝牙设备，用于摇一摇课堂签到。</p><p>7) Bluetooth Peripheral Use 连接其他蓝牙设备：用于连接其他蓝牙设备，用于发现和连接附近的蓝牙设备，用于摇一摇课堂签到。</p><p>8) 剪切板：用于获取或写入剪贴板信息，用户主动复制、剪贴跟粘贴的操作，需要访问剪切板。</p><p><b>Android操作系统应用权限列表</b></p><p>1) INTERNET 网络：访问网络，允许应用程序联网和发送数据的权限，以便提供用户服务。</p><p>2) ACCESS_NETWORK_STATE 获取WiFi状态：获取WiFi状态，检测联网方式，在网络异常状态下避免数据发送，节省流量和电量。</p><p>3) CAMERA 摄像头：使用摄像头，允许App使用摄像头，主要用于帮助用户使用扫一扫、拍摄图片及视频功能。</p><p>4) ACCESS_FINE_LOCATION 访问精确定位：过全球定位系统（GPS)或网络位置信息（基站和WLAN)获取精准地理位置信息，用于摇一摇课堂签到、网页中基于地理位置打卡签到时使用。</p><p>5) ACCESS_COARSE_LOCATION 访问粗略位置：通过网络位置信息（基站和WLAN)获取大致地理位置信息，用于摇一摇课堂签到、网页中基于地理位置打卡签到时使用。</p><p>6) RECORD_AUDIO，READ_MEDIA_AUDIO 录音：使用麦克风进行录音，在用户使用在线客服进行语音反馈问题时使用。</p><p>7) READ_EXTERNAL_STORAGE 读取外置存储器：提供读取手机储存空间内数据的功能，允许App读取存储中的图片、视频内容，主要用于帮助您发布内容，在本地记录崩溃日志功能。</p><p>8) WRITE_EXTERNAL_STORAGE 写入外置存储器：提供写入外部存储功能，允许App读取/写入/下载/保存图片、视频、文件、崩溃日志信息。</p><p>9) BLUETOOTH 蓝牙：允许应用程序连接到蓝牙设备配对，用于发现和连接附近的蓝牙设备，用于摇一摇课堂签到。</p><p>10) BLUETOOTH_ADMIN 蓝牙：允许程序进行发现和配对新的蓝牙设备，用于发现和连接附近的蓝牙设备，用于摇一摇课堂签到。</p><p>11) SENSORS 传感器：加速度传感器，用于检测手机运动状态，当您使用摇一摇功能时，我们会需要获取您的传感器信息（矢量、加速度、压力）信息，用于监测手机摇动幅度。</p><p>12) FLASHLIGHT 闪光灯：使用闪光灯，拍照时允许使用闪光灯。</p><p>13) VIBRATE 震动手机：使用振动，当扫描二维码有结果时会震动手机反馈给用户。</p><p>14) NFC 近场通信：使用NCF功能，读取附近的NFC设备内容，用于课堂签到及打卡的功能。</p><p>15) 剪切板：用于获取或写入剪贴板信息，用户主动复制、剪贴跟粘贴的操作，需要访问剪切板。</p><p><b>HarmonyOS操作系统应用权限列表</b></p><p>1) ohos.permission.INTERNET 使用网络：允许使用网络，允许应用程序联网和发送数据的权限，以便提供用户服务。</p><p>2) ohos.permission.GET_NETWORK_INFO 获取网络信息：允许应用获取数据网络信息，用于判断网络是否连接，获取network，网络连接状态信息（2g，3g，4g，5g，wifi），运营商信息。</p><p>3) ohos.permission.GET_WIFI_INFO 获取WI-FI信息：允许应用获取Wi-Fi信息，获取bssid，ssid，band，wifiip信息，用于用户登录保护。</p><p>4) ohos.permission.GET_BUNDLE_INFO 获取应用信息：允许查询应用的基本信息，获取已安装易班应用的基本信息。</p><p>5) ohos.permission.PRIVACY_WINDOW 禁止截屏录屏：允许应用将窗口设置为隐私窗口，禁止截屏录屏，在涉及输入敏感信息的页面（登录，修改密码页面），禁止用户截屏或录屏。</p><p>6) ohos.permission.ACCELEROMETER 传感器：允许应用读取加速度传感器的数据，当您使用摇一摇功能时，我们会需要获取您的传感器信息（矢量、加速度、压力）信息，用于监测手机摇动幅度。</p><p>7) ohos.permission.APP_TRACKING_CONSENT 读取开放匿名设备标识符：允许应用读取开放匿名设备标识符，获取设备OAID，用于提供注册登陆保护、设备风险保护、数据防盗爬、刷榜刷单防护、虚假用户裂变识别的账号安全风控服务。</p><p>8) ohos.permission.CAMERA 相机：允许应用使用相机，允许易班APP使用摄像头，主要用于帮助用户使用扫一扫、拍摄图片及视频功能时使用。</p><p>9) ohos.permission.APPROXIMATELY_LOCATION 访问粗略位置：允许应用获取设备模糊位置信息，用于网页中使用基于地理位置打卡或签到功能时使用。</p><p>10) ohos.permission.LOCATION 获取设备位置：允许应用获取设备位置信息，用于网页中使用基于地理位置打卡或签到功能时使用。</p><p>11) ohos.permission.ACCESS_BLUETOOTH 发现蓝牙设备：允许应用接入蓝牙并使用蓝牙能力，用于发现附近的蓝牙设备，用于摇一摇课堂签到。</p><p>12) ohos.permission.MICROPHONE 使用麦克风：允许应用使用麦克风，在用户使用在线客服进行语音反馈问题时使用。</p><p>13) 剪切板：用于获取或写入剪贴板信息，用户主动复制、剪贴跟粘贴的操作，需要访问剪切板。</p><p>　</p><p><b>若您拒绝授权上述列表中的权限，对应场景下的相关服务将受到限制或无法使用，但不影响您使用易班的其他功能。</b></p><p><b>14.征得同意的例外</b></p><p><b>请您知晓，根据相关法律法规、监管要求及国家标准，以下情形中，我方可能会收集、使用您的相关用户信息而无需另行征求您的授权同意：</b></p><p>1) 与我们履行法律法规规定的义务相关的；</p><p>2) 与国家安全、国防安全直接相关的；</p><p>3) 与公共安全、公共卫生、重大公共利益直接相关的；<p>4) 与刑事侦查、起诉、审判和判决执行等直接相关的；</p><p>5) 出于维护您或其他个人的生命、财产等重大合法权益但又很难得到本人授权同意的；</p><p>6) 所涉及的个人信息是您自行向社会公众公开的；</p><p>7) 根据您要求签订和履行合同所必需的；</p><p>8) 从合法公开披露的信息中收集个人信息的，如合法的新闻报道、政府信息公开等渠道；</p><p>9) 维护所提供的产品或服务的安全稳定运行所必需的，如发现、处置产品或服务的故障。</p><p><b>15.其他情况</b></p><p>请您理解，我们向您提供的功能和服务是不断更新和发展的，如果某一功能或服务未在前述说明中且收集了您的信息，我们会通过页面提示、交互流程、网站公告各种方式另行向您说明信息收集的内容、范围和目的，以征得您的同意。</p><p>目前，<b>易班不会主动从我们之外的第三方获取您的个人信息</b>。如未来为业务发展需要从其他第三方间接获取您的个人信息，我们会在获取前向您明示您个人信息的来源、类型及使用范围，如易班开展业务需进行的个人信息处理活动超出您原本向第三方提供个人信息时的授权同意范围，我们将在处理您的该个人信息前，征得您的明示同意；此外，我们也将会严格遵守相关法律法规的规定，并要求第三方保障其提供的信息的合法性。</b></p><p>关于个人敏感信息的安全保障：<b>我们努力为用户的信息安全提供保障，以防止信息的泄露、丢失、不当使用、未经授权访问和披露。在个人敏感信息的存储、传输、使用上，我们将采用加密、权限控制、去标识化/匿名化及相关安全措施，从而更好地保障信息安全。</b></p><p>　</p><p><b>（二）、我们如何使用信息</b></p><p>我们严格遵守法律法规的规定以及与用户的约定，按照本隐私保护指引所述使用收集的信息，以向您提供更为优质的服务。</p><p><b>1.信息使用规则</b></p><p>1) 我们会根据已收集的信息向您提供各项功能与服务，包括加好友、发消息、微社区相应的功能；</p><p>2) 我们会根据您使用易班的频率、故障信息、性能信息分析我们产品的运行情况，以确保服务的安全性并优化我们的产品，提高我们的服务质量。我们不会将我们存储在分析软件中的信息与您提供的个人身份信息相结合。</p><p><b>2.告知变动目的后征得同意的方式</b></p><p>我们将会在本隐私保护指引所涵盖的用途内使用收集的信息。如我们使用您的个人信息，超出了与收集时所声称的目的及具有直接或合理关联的范围，我们将在使用您的个人信息前，再次向您告知并征得您的明示同意。</p><p>　</p><p><b>二、我们如何使用 Cookie 和同类技术</b></p><p>Cookie和同类设备信息标识技术是互联网中普遍使用的技术。当您使用我们的服务时，我们会视情况使用相关技术向您的设备发送一个或多个Cookie 或匿名标识符（以下简称“Cookie”），以收集、标识和存储您访问、使用本产品时的信息。我们承诺，不会将Cookie用于本隐私政策所述目的之外的任何其他用途。我们使用Cookie主要为了保障产品与服务的安全、高效运转，可以使我们确认您易班账户的安全状态，排查崩溃、延迟的相关异常情况，帮助您省去重复您填写表单、输入搜索内容的步骤和流程。</p><p>大多数浏览器均为用户提供了清除浏览器缓存数据的功能，您可以进行相应的数据清除操作，或可修改对Cookie的接受程度或拒绝我们的Cookie。您将因为这些修改，无法使用依赖于Cookie的服务或相应功能。</p><p>　</p><p><b>三、我们如何共享、转让、公开披露您的信息</b></p><p>请您注意，目前除为实现本隐私指引第一条“我们如何收集和使用个人信息”部分所述的目的，<b>易班不会主动共享或转让您的个人信息至我们之外的第三方，如存在其他共享或转让您的个人信息或您需要我们将您的个人信息共享或转让至我们之外的第三方情形时，我们会直接或确认第三方征得您对上述行为的明示同意</b>。此外，我们会对对外提供信息的行为进行风险评估。</p><p>因共享、转让、公开披露您的个人信息发生安全事件而对您的合法权益造成损害的，我们将按照具体情形依法承担相应的法律责任，包括但不限于停止侵权、赔礼道歉、赔偿损失。</p><p>我们不会对外公开披露其收集的个人信息，如必须公开披露时，我们会向您告知此次公开披露的目的、披露信息的类型及涉及的相关敏感信息，并征得您的明示同意。</p><p>如因合并、分立、解散、被宣告破产等原因，我们需要转移您的个人信息，我们将告知您相关情形，以及接收方的名称或者姓名和联系方式，并要求接收方继续受本隐私保护指引的约束。如接收方变更本隐私保护指引中约定的个人信息处理目的、处理方式，我们将要求接收方重新获取您的授权同意。</p><p><b>请您知晓，以下情形中，我们共享、转让、公开披露个人信息无需事先征得个人信息主体的授权同意：</b></p><p>1) 与个人信息控制者履行法律法规规定的义务相关的；</p><p>2) 与国家安全、国防安全直接相关的；</p><p>3) 与公共安全、公共卫生、重大公共利益直接相关的；</p><p>4) 与刑事侦查、起诉、审判和判决执行等直接相关的；</p><p>5) 出于维护个人信息主体或其他个人的生命、财产等重大合法权益但又很难得到本人授权同意的；</p><p>6) 个人信息主体自行向社会公众公开的个人信息；</p><p>7) 从合法公开披露的信息中收集个人信息的，如合法的新闻报道、政府信息公开等渠道。</p><p>　</p><p><b>四、我们如何保护您的信息</b></p><p><b>（一）、信息的存储</b></p><p><b>1.信息存储的地点</b></p><p>我们会按照法律法规规定，将境内收集的用户个人信息存储于中国境内。目前我们不会跨境传输或存储您的个人信息。将来如需跨境传输或存储的，我们会向您告知信息出境的目的、接收方、安全保证措施和安全风险，并征得您的同意。</p><p><b>2.信息存储的方式和期限</b></p><p>1) <b>手机号码</b>：若您需要使用易班服务，我们需要一直保存您的手机号码，以保证您正常使用该服务。</p><p>2) <b>文字、图片或视频</b>：当您使用易班微社区和易瞄瞄功能发布了文字、图片、视频，我们需要一直保存您上述信息及相关评论，以保证您正常使用；当您主动删除上述信息后，我们将删除相应的信息。</p><p>3）<b>实名认证信息</b>：为了方便您使用易班实名认证功能，我们需要一直保存您的实名认证信息，以保证您正常使用；在您终止使用易班服务后，我们将对实名认证信息进行匿名化处理。</p><p>4) 在您终止使用易班服务后，我们会停止对您的信息的收集和使用。我们将按照《中华人民共和国网络安全法》及相关法律法规的规定，将您的<b>账号及已收集的相关个人信息（手机号码、入学年份、姓名、学校、学院、学号、录取通知书编号信息、头像、昵称、签名、星座、生日、性别、邮箱）</b>保存6个月；超出上述必要保存期限后，我们将对持有的您的个人信息进行删除或匿名化处理。</p><p>5) 当我们的产品或服务发生停止运营的情形时，我们将停止收集个人信息，将会通过官网、公众号、易班APP公告通知您，并在合理的期限内删除或匿名化处理您的个人信息。</p><p>　</p><p><b>（二）、信息的安全</b></p><p><b>1.安全保护措施</b></p><p>我们努力为用户的信息安全提供保障，以防止信息的泄露、丢失、不当使用、未经授权访问和披露。我们使用多方位的安全保护措施，以确保用户的个人信息保护处于合理的安全水平，包括技术保护手段、管理制度控制、安全体系保障及相关诸多方面。此外，我们还通过了国家网络安全等级保护（三级）的测评和备案，必要时可公开相关的合规证明。</p><p>我们采用业界领先的技术保护措施。我们使用的技术手段包括但不限于防火墙、加密、去标识化或匿名化处理、访问控制措施。此外，我们还会不断加强安装在您设备端的软件的安全能力。我们会在您的设备本地完成部分信息加密工作，以巩固安全传输；我们会了解您设备安装的应用信息和运行的进程信息，以预防病毒、木马及相关恶意程序。</p><p>在个人敏感信息的存储、传输、使用上，我们将采用加密、权限控制、去标识化/匿名化及相关安全措施，从而更好地保障信息安全。</p><p>我们建立了保障个人信息安全专门的管理制度、流程和组织。例如，我们严格限制访问信息的人员范围，要求他们遵守保密义务并进行审计，违反义务的人员会根据规定进行处罚。我们也会审查该管理制度、流程和组织，以防未经授权的人员擅自访问、使用或披露用户的信息。</p><p><b>2.安全事件处置措施</b></p><p>若发生个人信息泄露、损毁、丢失及相关安全事件，我们会启动应急预案，阻止安全事件扩大。安全事件发生后，我们会及时以推送通知、邮件及相关形式告知您安全事件的基本情况、我们即将或已经采取的处置措施和补救措施，以及我们对您的应对建议。如果难以实现逐一告知，我们将通过官网、公众号、易班APP公告的方式发布警示。</p><p>　</p><p><b>五、我们如何管理您的信息</b></p><p>您可以通过以下方式访问及管理您的信息：</p><p><b>1.查询、更正、补充和删除您的信息</b></p><p>您有权查询、更正或、补充和删除您的信息。您可以通过以下方式自行进行：</p><p>1) 登录易班APP，进入<b>“我的”</b>首页，点击<b>“个人头像-设置”</b>，可更正、修改您的个人资料（头像、昵称、签名、星座、生日、性别、个人主页背景）信息；</p><p>2) 登录易班APP，进入<b>“我的”</b>首页，点击<b>“校方认证”</b>，对自己的校方认证信息进行查询、更正或补充或重新认证；如果您要修改您的认证信息，您可以通过在线客服要求更正。出于安全性和身份识别的考虑或根据法律法规及监管规定，客服将在核实情况后操作；</p><p>3) 登录易班APP，进入<b>“我的”</b>首页，点击<b>“设置-关于易班-客服热线”</b>，可联系易班客服寻求帮助，协助您查询、更正或补充您的信息。</p><p>4) 登录易班APP，进入<b>“互动”</b>页面，点击<b>“我的-我的发布”</b>，查看或删除您已发布的信息。</p><p>5) 如果您需要获取您的个人信息副本，您可以登录易班APP，进入<b>“我的”</b>首页，点击<b>“设置-隐私-个人信息浏览与导出”</b>，浏览或导出您的个人信息。</p><p><b>2.管理您的授权范围</b></p><p>如果您想改变第三方授权范围，您可以通过易班APP<b>“我的-设置-隐私-授权管理”</b>查看或取消向第三方共享的信息授权。当您取消信息收集的授权后，我们将不再收集该信息；在您取消向第三方共享信息的授权后，我们将不再在该业务场景下向该第三方提供信息。</p><p><b>3.撤回系统授权</b></p><p>如果您想更改或撤回相关权限授权（<b>位置、相机、相册、麦克风</b>），您可以通过您的硬件设备进行修改、或在易班APP<b>“我的-设置-隐私-系统权限管理”</b>页面进行操作处理。</p><p><b>4.删除您的信息</b></p><p>在以下情形中，您可以向我们提出删除个人信息的请求：</p><p>1) 如果我们处理个人信息的行为违反法律法规；</p><p>2) 如果我们收集、使用您的个人信息，却未征得您的明确同意；</p><p>3) 如果我们处理个人信息的行为严重违反了与您的约定；</p><p>4) 如果您不再使用我们的产品或服务，或您主动注销了账号；</p><p>5) 如果我们永久不再为您提供产品或服务；</p><p>6) 若我们决定响应您的删除请求，我们还将同时尽力通知从我们处获得您的个人信息的主体，并要求其及时删除（除非法律法规另有规定，或这些主体已独立获得您的授权）；</p><p>7) 当您或我们协助您删除相关信息后，因为适用的法律和安全技术，我们无法立即从备份系统中删除相应的信息，我们将安全地存储您的个人信息并将其与任何进一步处理隔离，直到备份可以清除或实现匿名。</p><p><b>5.注销您的账户</b></p><p>您可以通过以下方式申请注销您的账户：</p><p>1) 登录易班APP，进入<b>“我的”</b>首页，点击<b>“设置-隐私-注销账号”</b>提交账户注销申请；<p>2) 登录易班APP，进入<b>“我的”</b>首页，点击<b>“设置-关于易班-客服热线”</b>，可联系易班客服寻求帮助，协助您申请注销您的账户。<p>在您主动注销账户之后，我们将停止为您提供产品或服务，根据适用法律的要求删除您的个人信息，或使其匿名化处理。已进行校方认证的账号自注销之日起将有15日冻结期，冻结期结束后，您的个人信息将会从易班平台删除或匿名化处理。</p><p><b>6.响应您的上述请求</b></p><p>如果您无法通过上述方式查询、修改或删除您的个人信息，或您需要查询、修改或删除您在使用我们产品与/或服务时所产生的其他个人信息，或您认为我方存在任何违反法律法规或与您关于个人信息的收集或使用的约定，您均可以通过本协议中的方式与我们联系。为保障安全，我方可能会先要求您验证自己的身份，然后再处理您的请求。请您理解，对于您合理的请求，我们原则上不收取费用，但对多次重复、超出合理限度的请求，我们将视情收取一定成本费用。对于那些无端重复、需要过多技术手段、给他人合法权益带来风险或者非常不切实际的请求，我方可能会予以拒绝并告知该决定的理由。您可以拨打易班客服热线<b>021-60781838</b>、发送邮件至客服邮箱<b>contact@yiban.cn</b>进行投诉，我们将在15日内处理并向您回复。</p><p>尽管有上述约定，但按照法律法规要求，如涉及以下情形我方将可能无法响应您的请求：</p><p>1) 与国家安全、国防安全有关的；</p><p>2) 与公共安全、公共卫生、重大公共利益有关的；</p><p>3) 与刑事侦查、起诉、审判和执行判决等有关的；</p><p>4) 有充分证据表明个人信息主体存在主观恶意或滥用权利的；</p><p>5) 响应您的请求将导致您或其他个人、组织的合法权益受到严重损害的；</p><p>6) 涉及商业秘密的。</p><p>　</p><p><b>六、我们如何处理未成年人的信息</b></p><p><b>我们的产品、网站和服务主要面向在校大学生、成人，不涉及未成年人的个人信息处理。</b>如果我们的产品、网站和服务发生变更，涉及到未成年人个人信息的处理，我们将按照相关法律法规、监管要求规定，完善未成年人个人信息保护政策，并按照该政策处理未成年人个人信息。</p><p>　</p><p><b>七、本政策如何更新</b></p><p>我们会视情况适时对本指引进行修订。当指引的条款发生变更时，我们会在您登录及版本更新时以不限于网站公示、推送通知、APP弹窗的形式向您展示变更后的指引。请您注意，只有在您点击弹窗中的同意按钮后，我们才会按照更新后的指引收集、使用、存储您的个人信息。</p><p>　</p><p><b>八、如何联系我们</b></p><p>如果您对本隐私保护指引有任何疑问、意见或建议，或有其他投诉、举报、信息授权及使用的相关问题，可以拨打易班客服热线<b>021-60781838</b>、发送邮件至客服邮箱<b>contact@yiban.cn</b>或通过易班APP在线客服与我们联系。您也可以将您的问题寄送至如下地址：<b>上海市杨浦区国康路100号21楼 上海易班企业发展有限公司 数据与隐私保护中心（收）</b>，邮编：200092。我们将尽快审核所涉问题，一般情况下，<b>我们将在验证您的用户身份后的15日内处理并向您回复</b>。</p><p>如果您对我们的回复不满意，特别是您认为我们的个人信息处理行为损害了您的合法权益，您还可以通过以下外部途径寻求解决方案：向易班公司住所地有管辖权的法院提起诉讼。</p><p>　</p><p style="text-align: right;"><b>上海易班企业发展有限公司</b></p>';
